# Builds BOTH release artifacts (standalone + installer) and attaches them to a GitHub Release.
#
# Trigger: push a version tag, e.g.
#     git tag v1.0.0 && git push origin v1.0.0
# The Windows runner already has Chocolatey (to install Inno Setup) and the GitHub CLI
# (to upload the artifacts), so no third-party actions are involved.
#
# You can also run it by hand from the Actions tab (workflow_dispatch) to smoke-test a build
# without publishing — that path skips the upload.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed for gh release create / upload

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      # -RequireInstaller: fail the build rather than publish a release missing the installer.
      - name: Build release artifacts
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build-release.ps1 -RequireInstaller

      - name: Upload build artifacts (always, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: metal-fatigue-patch
          path: dist/*

      # Only publish a Release when the run was triggered by a version tag.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # Create the release if it does not exist yet; otherwise just add the files.
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Metal Fatigue Community Patch $tag" --generate-notes
          }
          gh release upload $tag (Get-ChildItem dist -File | ForEach-Object { $_.FullName }) --clobber
