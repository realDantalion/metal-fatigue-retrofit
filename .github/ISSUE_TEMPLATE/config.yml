# Force people through the forms above instead of an empty text box - the two things
# that actually matter (patcher log, file hash) never turn up in free-form reports.
blank_issues_enabled: false
contact_links:
  - name: Is this actually a bug?
    url: https://github.com/realDantalion/metal-fatigue-retrofit#things-that-are-not-bugs
    about: Expected behaviour that gets reported a lot - Steam file verification, the ~50 combot cap on the non-Maximum versions, multiplayer desyncs, the unknown-publisher warning.
